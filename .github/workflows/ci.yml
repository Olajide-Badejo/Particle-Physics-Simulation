name: ci

# Three jobs. No runner has a GPU, so no device code is ever executed here.
#
#   host-tests   runs the style gate and the gate registry check
#                (check_provenance.py --gates-only), then builds the CUDA free
#                half of the project and runs its three ctest entries:
#                unit_host (unit_tests_host), validation_host
#                (validation_tests_host, the physics gates that need no device:
#                the pair force expression, the Plummer sampler and the SPH
#                kernel normalisation) and doc_numbers_tool (the test of
#                check_doc_numbers.py). No toolkit involved at all.
#   cuda-build   compiles the whole project inside the official CUDA image with
#                -DCPS_FAT_BINARY=ON and warnings as errors, so physics_core
#                targets sm_75 to sm_120 and everything else sm_120. It checks
#                that real sm_120 and sm_75 code was emitted, then runs the full
#                ctest: the three host entries run again, and unit_gpu,
#                integration and validation find no device, exit with code 77
#                and show as Skipped.
#   reports      runs the full provenance check, which resolves every commit
#                hash in experiments/results and so needs the whole history.
#                It then rebuilds the figures, tables, docs/generated_numbers.md
#                and both PDFs from the committed results, fails if the
#                regenerated tables or numbers differ from the committed ones,
#                runs check_doc_numbers.py over the tracked Markdown files, and
#                runs the style gate over the PDFs.
#
# Not executed anywhere in CI: the device unit tests, the integration and resume
# tests, and the device validation gates (energy drift, orbit shape, momentum,
# the force kernel against its reference, SPH density and neighbour search).
# Those need a GPU. Nothing in CI writes to experiments/results.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests, no CUDA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ python3 poppler-utils

      - name: Style gate
        run: python3 scripts/check_no_dashes.py .

      - name: Every registered gate has a committed result
        run: python3 scripts/check_provenance.py --gates-only

      - name: Configure without CUDA
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPS_HOST_ONLY=ON -DCPS_BUILD_TESTS=ON

      - name: Build with warnings as errors
        run: cmake --build build -j "$(nproc)"

      - name: Run the host tests
        run: ctest --test-dir build --output-on-failure -L host

  cuda-build:
    name: CUDA fat build, sm_75 to sm_120
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The official image pins the same toolkit the results were measured with,
    # which makes this job deterministic in a way a network installer is not.
    container: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake git ca-certificates python3 build-essential

      - uses: actions/checkout@v7

      - name: Report the toolchain
        run: |
          nvcc --version
          cmake --version
          g++ --version | head -1

      - name: Configure
        # No GPU is present, so the device tests are built but skip when run.
        # Compiling them is the point: it is what catches a kernel that no longer
        # compiles.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPS_FAT_BINARY=ON \
            -DCPS_BUILD_TESTS=ON \
            -DCPS_BUILD_BENCHMARKS=ON \
            -DCPS_USE_FAST_MATH=ON

      - name: Build everything with warnings as errors
        run: cmake --build build -j "$(nproc)"

      - name: Confirm real sm_120 and sm_75 code was emitted, not just PTX
        # A build can silently target the wrong architecture and still run
        # through just in time compilation, at the wrong speed. The object file
        # is the only thing that settles it.
        run: |
          cuobjdump --list-elf build/CMakeFiles/physics_core.dir/src/kernels/nbody_tiled.cu.o \
            | tee /tmp/elf.txt
          grep -q "sm_120" /tmp/elf.txt
          grep -q "sm_75" /tmp/elf.txt

      - name: Run the full test suite, with the device entries skipped
        run: ctest --test-dir build --output-on-failure

  reports:
    name: Reports and style gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The provenance check resolves commit hashes from the whole history.
          fetch-depth: 0

      - name: Install TeX and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern poppler-utils \
            make git python3 python3-matplotlib python3-tqdm

      - name: Every committed result traces back to a commit in this repository
        run: python3 scripts/check_provenance.py

      - name: Regenerate figures and tables from the committed results
        # The canonical result files are committed, so the documents rebuild
        # here from real recorded data with no GPU involved.
        run: |
          python3 scripts/plot_results.py
          python3 scripts/gen_report_assets.py

      - name: Confirm the generated assets match the committed ones
        # If this fails, someone edited a figure or a table by hand instead of
        # regenerating it, which is exactly what the pipeline exists to prevent.
        # Status rather than diff, so that a generated file nobody committed
        # fails too.
        run: |
          git status --short -- report/tables report/numbers.tex docs/generated_numbers.md \
            | tee /tmp/assets.txt
          test ! -s /tmp/assets.txt \
            || (echo "generated assets differ from the committed ones" && exit 1)

      - name: Confirm the numbers marked in the Markdown files match
        run: python3 scripts/check_doc_numbers.py

      - name: Build both reports
        run: |
          make -C report
          make -C report_debug

      - name: Style gate over the compiled PDFs
        # TeX turns two hyphens into an en dash silently, so only the finished
        # document proves the rule held.
        run: python3 scripts/check_no_dashes.py .

      - name: Upload the reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            report/main.pdf
            report_debug/debug_report.pdf
