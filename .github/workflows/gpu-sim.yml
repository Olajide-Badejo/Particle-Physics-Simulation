name: GPU tests (simulated)

# Optional, non-required check. The hosted runners have no GPU, so the device
# ctest entries (unit_gpu, integration, validation) skip in the main CI. This
# runs them on a simulated NVIDIA H100 provided by PantheonSim
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing
# and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

permissions:
  contents: read

concurrency:
  group: gpu-sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: Device tests on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only (the simulator JIT-compiles PTX) and the
      # shared CUDA runtime is required by the simulator. The benchmarks are
      # not needed for the tests.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCPS_BUILD_TESTS=ON \
            -DCPS_BUILD_BENCHMARKS=OFF

      - name: Build the device tests
        run: |
          vgpu run --preload cmake --build build -j3 \
            --target unit_tests_gpu integration_tests validation_tests

      # The validation entry is run as a subset. Three of its Plummer sphere
      # tests are left out because they are slow on the simulator (in a full
      # run, one took 47 minutes, one 6.5 minutes, and the energy bound test
      # was still going when the 60 minute ctest timeout hit). The other
      # tests in the entry run.
      # Without a device each of these binaries exits with 77 and ctest shows
      # it as Not Run, so a skipped, missing or failed entry fails the job
      # here, as does a missing device line or a simulator error.
      - name: Run the device ctest entries
        run: |
          set -o pipefail
          status=0
          validation_filter='EnergyDrift.*:ForceAntisymmetry.*:SphValidation.*:MomentumConservation.ThePlummerSphereStartsNearVirialEquilibrium'
          for entry in unit_gpu integration validation; do
            echo "::group::ctest $entry"
            start=$SECONDS
            filter='*'
            [ "$entry" = validation ] && filter="$validation_filter"
            GTEST_FILTER="$filter" vgpu run ctest --test-dir build -R "^${entry}\$" --no-tests=error \
              --timeout 2400 --output-on-failure -V 2>&1 | tee "ctest-$entry.log" || status=1
            echo "$entry took $((SECONDS - start)) s"
            echo "::endgroup::"
          done
          for entry in unit_gpu integration validation; do
            log="ctest-$entry.log"
            grep -q 'virtual GPU platform initialized: 1 x nvidia/h100' "$log" \
              || { echo "$entry: no simulated device line"; status=1; }
            grep -q '100% tests passed, 0 tests failed out of 1' "$log" \
              || { echo "$entry: did not pass"; status=1; }
            if grep -Eq 'Not Run|Skipped|\[  SKIPPED \]|VirtualGPU error|hardware required|no CUDA device' "$log"; then
              echo "$entry: skipped test or device error"; status=1
            fi
            grep -E '^\[  (PASSED|FAILED)  \]|tests ran' "$log" || true
          done
          exit $status
